name: Verify published installers
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Installer release tag
        required: true
        default: v0.7.5
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'v1.0-deps' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download and verify the published installer set
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$TAG" --dir artifacts
          cd artifacts
          version="${TAG#v}"
          for file in "Ember-Setup-v$version-x64.exe" "Ember-$version-1.x86_64.rpm" "Ember-$version-android-arm64.apk" "Ember-Web-$version-Cloudflare-Pages.zip" SHA256SUMS; do
            test -s "$file"
          done
          sha256sum -- *.apk *.exe *.rpm *.zip | sort > actual-checksums.txt
          sort SHA256SUMS > expected-checksums.txt
          diff -u expected-checksums.txt actual-checksums.txt
          rpm -qip "Ember-$version-1.x86_64.rpm"

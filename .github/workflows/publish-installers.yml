name: Publish verified installers
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the installer files for this tag
        uses: actions/checkout@v4
        with:
          ref: downloads/${{ github.ref_name }}
          persist-credentials: false

      - name: Verify checksums and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
          assets=(*.apk *.exe *.rpm *.zip SHA256SUMS)
          for file in "${assets[@]}"; do test -s "$file"; done
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Ember ${TAG#v}" --notes-file RELEASE.md

name: Check Android startup
on: workflow_dispatch
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-x86-startup
          cache-on-failure: true
      - run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: chmod +x src-tauri/gen/android/gradlew
      - run: npm run tauri -- android build --target x86_64 --apk --ci
      - name: Sign disposable emulator APK
        run: |
          keytool -genkeypair -keystore /tmp/smoke.jks -storepass android -keypass android -alias smoke -dname CN=Smoke -keyalg RSA -validity 2
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk' | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks /tmp/smoke.jks --ks-pass pass:android --out /tmp/ember-smoke.apk "$apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install /tmp/ember-smoke.apk
            adb logcat -c
            adb shell am start -W -n app.ember.desktop/.MainActivity
            sleep 12
            adb logcat -d > android-startup.log
            adb shell pidof app.ember.desktop
            adb shell am force-stop app.ember.desktop
            adb shell am start -W -n app.ember.desktop/.MainActivity
            sleep 8
            adb shell pidof app.ember.desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-log
          path: android-startup.log


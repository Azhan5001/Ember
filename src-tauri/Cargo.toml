[package]
name = "ember"
version = "0.7.4"
edition = "2021"
[lib]
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "process", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json", "system-proxy", "multipart"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
url = "2"
librqbit = { version = "8", default-features = false, features = ["rust-tls"] }
anyhow = "1"
async-stream = "0.3"
futures-core = "0.3"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
webkit2gtk = "2"
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
panic = "abort"
strip = true
[profile.dev]
debug = 0
incremental = false

[dependencies.aes-gcm]
version = '0.10'
[dependencies.base64]
version = '0.22'

[features]
custom-protocol = ["tauri/custom-protocol"]


<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#242129;color:white;font:14px system-ui}nav{position:sticky;top:0;background:#242129;padding:10px;z-index:5;display:flex;gap:8px;flex-wrap:wrap}button,select{padding:8px}iframe{display:block;border:1px solid #555;transform-origin:top left}#stage{margin:14px;overflow:auto;height:820px}#report{white-space:pre-wrap}</style></head><body><nav><select id="size" aria-label="Viewport"><option value="360,800">Phone 360×800</option><option value="800,360">Phone landscape 800×360</option><option value="280,653">Fold cover 280×653</option><option value="540,720">Duo single pane 540×720</option><option value="720,540">Duo landscape 720×540</option><option value="768,1024">iPad 768×1024</option><option value="1024,768">iPad landscape 1024×768</option><option value="820,1180">Tablet 820×1180</option><option value="1180,820">Tablet landscape 1180×820</option><option value="1280,800">Desktop 1280×800</option></select><button id="fixture">Load synthetic viewing history</button><button id="playback">Load playback fixture</button><button id="profiles">Profiles preview</button><button id="measure">Measure overflow</button><button id="matrix">Run viewport matrix</button><span id="report"></span></nav><div id="stage"><iframe id="app" title="Ember preview" src="/" width="360" height="800"></iframe></div><script type="module">
import {migrate} from '/src/defaults.ts';
import {ensurePeople} from '/src/profile-core.mjs';
import {recordHistory} from '/src/history-core.mjs';
const frame=document.querySelector('#app'),size=document.querySelector('#size'),report=document.querySelector('#report');
function resize(){const [w,h]=size.value.split(',');frame.width=w;frame.height=h;frame.style.transform=Number(w)>1260?'scale(.85)':'';}
size.onchange=resize;resize();document.querySelector('#profiles').onclick=()=>frame.src='/tests/carousel-preview.html';
const measure=()=>{const doc=frame.contentDocument;return {size:size.selectedOptions[0].text,viewport:doc.documentElement.clientWidth,page:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth+1}};
document.querySelector('#measure').onclick=()=>report.textContent=JSON.stringify(measure());
document.querySelector('#matrix').onclick=async()=>{const out=[];for(let n=0;n<size.options.length;n++){size.selectedIndex=n;resize();await new Promise(r=>setTimeout(r,150));out.push(measure());}report.textContent=JSON.stringify(out);};
document.querySelector('#playback').onclick=async()=>{const base=location.origin+'/tests/history-provider';const manifest=await fetch(base+'/manifest.json').then(r=>r.json());const empty=migrate({profile:'Guest',addons:[],library:[],progress:{},history:{},settings:{}});const data=ensurePeople({...empty,addons:[{base,manifest,enabled:true}],addonDefaultsVersion:3},empty);data.addons=[{base,manifest,enabled:true}];data._people.guest={...data._people.guest,addons:data.addons};localStorage.setItem('ember',JSON.stringify(data));frame.src='/';};
document.querySelector('#fixture').onclick=()=>{const movie={id:'tt0133093',name:'The Matrix',type:'movie',genres:['Action','Sci-Fi'],language:'en',year:'1999',imdbRating:'8.7',poster:'https://images.metahub.space/poster/medium/tt0133093/img',background:'https://images.metahub.space/background/medium/tt0133093/img'};const empty=migrate({profile:'Guest',addons:[],library:[],progress:{},history:{},settings:{}});let data=ensurePeople({...empty,history:recordHistory({}, {item:movie,vid:movie.id,duration:100,ranges:[[0,40]],updatedAt:Date.now()}),progress:{'movie:tt0133093':{item:movie,vid:movie.id,duration:100,position:40,updatedAt:Date.now()}}},empty);localStorage.setItem('ember',JSON.stringify(data));frame.src='/';};
</script></body></html>
